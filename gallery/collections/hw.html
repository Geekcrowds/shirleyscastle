<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Hot Wheels Inventory</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
*{box-sizing:border-box}body{margin:0}
header{position:sticky;top:0;z-index:10;background:#111827;color:white;padding:12px 14px 10px;box-shadow:0 2px 8px #0002}
h1{font-size:20px;margin:0 0 8px}.sub{font-size:12px;color:#cbd5e1}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
input,select,button{font:inherit;border-radius:9px;border:1px solid #cbd5e1}
input,select{background:white;padding:9px;min-width:0}
button{border:0;padding:9px 12px;background:#2563eb;color:#fff;font-weight:600}
button.secondary{background:#475569}.actions{display:flex;gap:7px;margin-top:8px}
.stats{background:#fff;padding:10px 14px;border-bottom:1px solid #e5e7eb;display:flex;gap:18px;font-size:13px;position:sticky;top:104px;z-index:8}
main{padding:10px;max-width:900px;margin:auto}
.card{background:white;border:1px solid #e5e7eb;border-radius:12px;margin-bottom:8px;padding:10px}
.top{display:flex;gap:9px;align-items:flex-start}
.num{font-weight:800;font-size:15px;min-width:38px}.model{font-weight:700;line-height:1.25;flex:1}.series{font-size:12px;color:#64748b;margin-top:3px}
.notes{font-size:11px;color:#7c2d12;margin-top:4px}
.qty{display:flex;align-items:center;gap:6px;margin-top:8px}
.qty button{width:38px;height:38px;padding:0;font-size:20px}
.qty input{width:62px;text-align:center;height:38px;padding:4px;font-weight:700}
.saved{color:#16a34a;font-size:11px;margin-left:auto}
.empty{text-align:center;padding:30px;color:#64748b}
@media(min-width:700px){.controls{grid-template-columns:1fr 2fr 1fr 1fr}.actions{grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <h1 id="title">🚗 2026 Hot Wheels Inventory</h1>
  <div class="sub">Tap − / + or enter the quantity you own. Changes are saved automatically on this phone/browser.</div>
  <div class="controls">
    <select id="year">
      <option value="2027">2027</option>
      <option value="2026" selected>2026</option>
      <option value="2025">2025</option>
      <option value="2024">2024</option>
    </select>
    <input id="search" type="search" placeholder="Search model, #, series…">
    <select id="series"><option value="">All series</option></select>
    <select id="status">
      <option value="">All items</option><option value="owned">Owned (&gt;0)</option><option value="missing">Missing (0)</option>
    </select>
  </div>
  <div class="actions">
    <button id="save">Save now</button>
    <button class="secondary" id="export">Export</button>
    <button class="secondary" id="reset">Reset all</button>
  </div>
</header>
<div class="stats"><span id="shown">0 shown</span><span id="total">0 owned</span><span id="unique">0 / 0 variants</span><span class="saved" id="saveState">Saved</span></div>
<main id="list"></main>

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function initYearSelect() {
  ITEMS = DATASETS[currentYear] || [];
  KEY = `hw-inventory-${currentYear}`;
  qty = JSON.parse(localStorage.getItem(KEY) || "{}");
  $("title").textContent = `🚗 ${currentYear} Hot Wheels Inventory`;
  
  const seriesSelect = $("series");
  seriesSelect.innerHTML = '<option value="">All series</option>';
  const series = [...new Set(ITEMS.map(x=>x.series))].sort();
  series.forEach(s => seriesSelect.insertAdjacentHTML("beforeend", `<option>${esc(s)}</option>`));
  
  render();
}

function save(){
  localStorage.setItem(KEY, JSON.stringify(qty));
  $("saveState").textContent = "Saved " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
}

function setQty(id,v){
  v = Math.max(0, Math.floor(Number(v)||0));
  if(v===0) delete qty[id]; else qty[id]=v;
  save(); render();
}

function filtered(){
  const q=$("search").value.toLowerCase().trim(), s=$("series").value, st=$("status").value;
  return ITEMS.filter(x=>{
    const hay=(x.col+" "+x.model+" "+x.series+" "+x.seriesNo+" "+(x.notes||"")).toLowerCase();
    const n=qty[x.id]||0;
    return (!q||hay.includes(q)) && (!s||x.series===s) &&
      (!st||(st==="owned"?n>0:n===0));
  });
}

function render(){
  const arr=filtered();
  $("shown").textContent=arr.length+" shown";
  const total=Object.values(qty).reduce((a,b)=>a+b,0);
  const ownedVariants=ITEMS.filter(x=>(qty[x.id]||0)>0).length;
  $("total").textContent=total+" owned";
  $("unique").textContent=ownedVariants+" / "+ITEMS.length+" variants";
  $("list").innerHTML=arr.length ? arr.map(x=>{
    const n=qty[x.id]||0;
    return `<div class="card">
      <div class="top"><div class="num">#${esc(x.col)}</div><div class="model">${esc(x.model)}
        <div class="series">${esc(x.series)} · ${esc(x.seriesNo)}</div>
        ${x.notes?`<div class="notes">${esc(x.notes)}</div>`:""}
      </div></div>
      <div class="qty">
        <button aria-label="Decrease" onclick="setQty('${x.id}',${n-1})">−</button>
        <input inputmode="numeric" pattern="[0-9]*" value="${n}" onchange="setQty('${x.id}',this.value)" aria-label="Quantity">
        <button aria-label="Increase" onclick="setQty('${x.id}',${n+1})">+</button>
        <span style="font-size:12px;color:#64748b">${n===0?"Not owned":n===1?"1 item":n+" items"}</span>
      </div>
    </div>`;
  }).join("") : '<div class="empty">No matching items.</div>';
}

$("year").addEventListener("change", (e) => {
  currentYear = e.target.value;
  initYearSelect();
});
$("search").addEventListener("input",render);
$("series").addEventListener("change",render);
$("status").addEventListener("change",render);
$("save").onclick=save;
$("reset").onclick=()=>{if(confirm(`Reset all quantities to 0 for ${currentYear}?`)){qty={};save();render();}};
$("export").onclick=()=>{
  const blob=new Blob([JSON.stringify({year:currentYear,date:new Date().toISOString(),quantities:qty},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`hot-wheels-${currentYear}-inventory.json`;a.click();URL.revokeObjectURL(a.href);
};

initYearSelect();
</script>
</body>
</html>
