<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Hot Wheels Inventory</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:10;background:#111827;color:white;padding:12px 14px 10px;box-shadow:0 2px 8px #0002}h1{font-size:20px;margin:0 0 8px}.sub{font-size:12px;color:#cbd5e1}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#cbd5e1}input,select,button{font:inherit;border-radius:9px;border:1px solid #cbd5e1}input,select{background:white;padding:9px;min-width:0}button{border:0;padding:9px 12px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}button.secondary{background:#475569}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.stats{background:#fff;padding:10px 14px;border-bottom:1px solid #e5e7eb;display:flex;flex-wrap:wrap;gap:18px;font-size:13px;position:sticky;top:104px;z-index:8}.saved{color:#16a34a;font-size:11px;margin-left:auto}main{padding:10px;max-width:900px;margin:auto}.card{background:white;border:1px solid #e5e7eb;border-radius:12px;margin-bottom:8px;padding:10px}.top{display:flex;gap:9px;align-items:flex-start}.num{font-weight:800;font-size:15px;min-width:38px}.model{font-weight:700;line-height:1.25;flex:1}.series{font-size:12px;color:#64748b;margin-top:3px}.notes{font-size:11px;color:#7c2d12;margin-top:4px}.qty{display:flex;align-items:center;gap:6px;margin-top:8px}.qty button{width:38px;height:38px;padding:0;font-size:20px}.qty input{width:62px;text-align:center;height:38px;padding:4px;font-weight:700}.quantity-label{font-size:12px;color:#64748b}.empty{text-align:center;padding:30px;color:#64748b}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}@media(min-width:700px){.controls{grid-template-columns:1fr 2fr 1fr 1fr}.actions{grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <h1 id="title">🚗 Hot Wheels Inventory</h1>
  <div class="sub">Tap − / + or enter the quantity you own. Changes are saved automatically on this phone/browser.</div>
  <div class="controls">
    <label for="year">Year<select id="year"><option value="2027">2027</option><option value="2026" selected>2026</option><option value="2025">2025</option><option value="2024">2024</option></select></label>
    <label for="search">Search<input id="search" type="search" placeholder="Search model, #, series…"></label>
    <label for="series">Series<select id="series"><option value="">All series</option></select></label>
    <label for="status">Status<select id="status"><option value="">All items</option><option value="owned">Owned (&gt;0)</option><option value="missing">Missing (0)</option></select></label>
  </div>
  <div class="actions"><button id="save" type="button">Save now</button><button class="secondary" id="export-json" type="button">Export JSON</button><button class="secondary" id="export-csv" type="button">Export CSV</button><button class="secondary" id="reset" type="button">Reset all</button></div>
</header>
<div class="stats"><span id="shown">0 shown</span><span id="total">0 owned</span><span id="unique">0 / 0 variants</span><span class="saved" id="saveState" aria-live="polite">Saved</span></div>
<main id="list" aria-live="polite" aria-busy="true"></main>
<script type="module">
import { loadDatasets } from './data/hw-data.js';

const $ = id => document.getElementById(id);
const STORAGE_PREFIX = 'hw-inventory-v2-';
const state = { year: '2026', items: [], quantities: {}, query: '', series: '', status: '' };
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

function storageKey(){ return `${STORAGE_PREFIX}${state.year}`; }
function loadInventory(){
  try { const value = JSON.parse(localStorage.getItem(storageKey()) || '{}'); state.quantities = value && typeof value === 'object' && !Array.isArray(value) ? value : {}; }
  catch { state.quantities = {}; setSaveMessage('Could not read saved inventory'); }
}
function saveInventory(){
  try { localStorage.setItem(storageKey(), JSON.stringify(state.quantities)); setSaveMessage(`Saved ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`); }
  catch { setSaveMessage('Unable to save inventory'); }
}
function setSaveMessage(message){ $('saveState').textContent = message; }
function setQuantity(id, value){ const quantity = Math.max(0, Math.floor(Number(value) || 0)); if(quantity) state.quantities[id] = quantity; else delete state.quantities[id]; saveInventory(); render(); }
function visibleItems(){
  const query = state.query.toLowerCase().trim();
  return state.items.filter(item => { const hay = [item.col,item.model,item.series,item.seriesNo,item.notes].join(' ').toLowerCase(); const quantity = state.quantities[item.id] || 0; return (!query || hay.includes(query)) && (!state.series || item.series === state.series) && (!state.status || (state.status === 'owned' ? quantity > 0 : quantity === 0)); });
}
function renderSeries(){ const select = $('series'); select.innerHTML = '<option value="">All series</option>'; [...new Set(state.items.map(item => item.series))].sort().forEach(series => { const option = document.createElement('option'); option.value = series; option.textContent = series; select.append(option); }); }
function render(){
  const items = visibleItems(); const total = Object.values(state.quantities).reduce((sum, value) => sum + (Number(value) || 0), 0); const owned = state.items.filter(item => (state.quantities[item.id] || 0) > 0).length;
  $('shown').textContent = `${items.length} shown`; $('total').textContent = `${total} owned`; $('unique').textContent = `${owned} / ${state.items.length} variants`;
  $('list').innerHTML = items.length ? items.map(item => { const quantity = state.quantities[item.id] || 0; return `<article class="card"><div class="top"><div class="num">#${esc(item.col)}</div><div class="model">${esc(item.model)}<div class="series">${esc(item.series)} · ${esc(item.seriesNo)}</div>${item.notes ? `<div class="notes">${esc(item.notes)}</div>` : ''}</div></div><div class="qty"><button type="button" data-action="decrease" data-id="${esc(item.id)}" aria-label="Decrease quantity of ${esc(item.model)}">−</button><label class="quantity-label" for="quantity-${esc(item.id)}">Quantity<input id="quantity-${esc(item.id)}" type="number" min="0" step="1" inputmode="numeric" value="${quantity}" data-action="quantity" data-id="${esc(item.id)}"></label><button type="button" data-action="increase" data-id="${esc(item.id)}" aria-label="Increase quantity of ${esc(item.model)}">+</button><span class="quantity-label">${quantity === 0 ? 'Not owned' : quantity === 1 ? '1 item' : `${quantity} items`}</span></div></article>`; }).join('') : '<div class="empty">No matching items.</div>';
  $('list').setAttribute('aria-busy','false');
}
function download(filename, content, type){ const url = URL.createObjectURL(new Blob([content], {type})); const link = document.createElement('a'); link.href = url; link.download = filename; link.click(); setTimeout(() => URL.revokeObjectURL(url), 0); }
function exportJSON(){ download(`hot-wheels-${state.year}-inventory.json`, JSON.stringify({year: state.year, exportedAt: new Date().toISOString(), quantities: state.quantities}, null, 2), 'application/json'); }
function exportCSV(){ const headers = ['year','id','collection_number','model','series','series_number','notes','quantity']; const rows = state.items.map(item => [state.year,item.id,item.col,item.model,item.series,item.seriesNo,item.notes || '',state.quantities[item.id] || 0]); const csv = [headers,...rows].map(row => row.map(value => `"${String(value).replace(/"/g,'""')}"`).join(',')).join('\n'); download(`hot-wheels-${state.year}-inventory.csv`, csv, 'text/csv;charset=utf-8'); }
function initYear(){ state.items = state.datasets[state.year] || []; loadInventory(); $('title').textContent = `🚗 ${state.year} Hot Wheels Inventory`; renderSeries(); render(); }
function bindEvents(){
  $('year').addEventListener('change', event => { state.year = event.target.value; initYear(); });
  $('search').addEventListener('input', event => { state.query = event.target.value; render(); }); $('series').addEventListener('change', event => { state.series = event.target.value; render(); }); $('status').addEventListener('change', event => { state.status = event.target.value; render(); }); $('save').addEventListener('click', saveInventory); $('export-json').addEventListener('click', exportJSON); $('export-csv').addEventListener('click', exportCSV);
  $('reset').addEventListener('click', () => { if(confirm(`Reset all quantities to 0 for ${state.year}?`)){ state.quantities = {}; saveInventory(); render(); } });
  $('list').addEventListener('click', event => { const control = event.target.closest('[data-action]'); if(!control) return; const current = state.quantities[control.dataset.id] || 0; setQuantity(control.dataset.id, current + (control.dataset.action === 'increase' ? 1 : -1)); });
  $('list').addEventListener('change', event => { if(event.target.dataset.action === 'quantity') setQuantity(event.target.dataset.id, event.target.value); });
}
const datasets = await loadDatasets(); state.datasets = datasets; bindEvents(); initYear();
</script>
</body>
</html>
