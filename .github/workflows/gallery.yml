name: Publish Gallery

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  deploy:
    name: Publish Gallery to GitHub Pages
    if: ${{ github.repository != 'gautamkrishnar/github-pages-gallery' && github.event.head_commit.message != '' && github.event.head_commit.message != 'Initial commit' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Gallery
        run: docker run -v "$(pwd):/work" ghcr.io/thumbsup/thumbsup /bin/sh -c "cd /work/ && thumbsup --config config.json"

      - name: Copy custom collection pages
        run: |
          sudo chown -R "$USER:$USER" build_output
          mkdir -p build_output/collections/data
          cp gallery/collections/*.html build_output/collections/
          cp gallery/collections/data/* build_output/collections/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build_output

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
